# Copy to config.yaml (gitignored) and fill in.

poll_interval: 2m
db_path: ~/.local/share/pt/pt.db

# Where pt.db lives between runs. Omit for local disk.
# state:
#   gcs: { bucket: my-pt-state, object: pt.db }

source:
  gcp_logging:
    # Adding an environment is one more entry; each keeps its own cursor and
    # alerts separately. Every Cloud Run service and job in the project is read;
    # the ones not running resolver.cloud_run.image are skipped.
    environments:
      - { name: develop,    project: divdot-develop }
      - { name: testing,    project: jetpay-testing }
      - { name: demo,       project: jetpay-demo }
      - { name: staging,    project: jetpay-staging }
      - { name: production, project: divdot-production }
    # The default; stderr is where uncaught exceptions (job crashes) land:
    # filter: (log_id("run.googleapis.com/stdout") OR log_id("run.googleapis.com/stderr")) AND severity>=ERROR
    # overlap: 10m    # re-read window for entries Cloud Logging indexes late
    # lookback: 1h    # how far back the very first run starts
  # file: events.jsonl   # local replay instead

# Revision or job execution -> image digest -> the image's short-SHA tag in
# Artifact Registry.
resolver:
  cloud_run:
    image: us-central1-docker.pkg.dev/baseline-shared/internal-api/internal-api
  # static: { "*": <sha> }   # replaying files: treat every revision as this commit

# pt's own clone, fetched when a deployed commit is missing. One-time setup:
#   git clone --bare <remote> ~/.local/share/pt/jetpay.git
#   git -C ~/.local/share/pt/jetpay.git config remote.origin.fetch '+refs/heads/*:refs/heads/*'
repo:
  dir: ~/.local/share/pt/jetpay.git
  fallback_ref: main   # blamed, and flagged, when the deployed commit can't be resolved
  # ignore_revs_file: .git-blame-ignore-revs   # only if the repo has one; git fails otherwise
  path_map:
    /workspace/: src/   # Dockerfile copies src/ into $PROJECT_ROOT=/workspace

owner:
  identities:
    - hamzahhaider1@gmail.com
    # - <work email>
  # An error is yours if a frame is in one of these subsystems (whoever wrote
  # the line), or if blame credits you with a frame's line outside the ignore list.
  subsystems:
    payment-channels: [src/payments/channels/**]
    state-mapping: [src/payments/state_mapping/**, src/payments/transaction_state_management.py]
    batch-payouts:
      - src/payments/batch_payouts/**
      - src/endpoints/graphql/flows/payments/transactions/create_batch_*/**
      - src/adyen/adyen_payout_job_runner.py
      - src/adyen/services/adyen_payout_*.py
      - src/adyen/management/commands/adyen_initiate_payouts.py
    payment-movements:
      - src/payments/domain/movements/**
      - src/payments/views/movement_detail_builder.py
      - src/payments/models/movement.py
    pre-auth-captures:
      - src/payments/domain/captures/**
      - src/payments/services/preauth_*.py
      - src/payments/services/approve_preauth_service.py
      - src/payments/services/capture_*.py
      - src/payments/preauth_adjustment_guards.py
      - src/payments/models/preauth_adjustment.py
      - src/payments/serializers/*preauth*.py
      - src/payments/serializers/captures.py
      - src/payments/management/commands/fail_stale_preauth_adjustments.py
      - src/adyen/services/adyen_capture_*.py
      - src/adyen/services/adyen_authorisation_adjustment_event_handler.py
      - src/adyen/models/adyen_capture.py
      - src/adyen/models/adyen_authorisation_adjustment.py
  # Code you've touched but don't own: blame here is disregarded.
  ignore:
    # recurring plans
    - src/payments/recurring_plan_strategy.py
    - src/endpoints/graphql/flows/payments/recurring/**
    - src/endpoints/utils/recurring_plan_operations.py
    - src/adyen/models/adyen_recurring_contract.py
    # settings and routing
    - src/api/settings/**
    - src/api/urls.py
    # shared plumbing that shows up in everyone's stacks
    - src/api/log.py
    - src/core/models/user.py
    - src/common/rest_framework/authentication.py

# Alerts always go to stdout (journalctl --user -u pt), plus each channel below
# whose rules match. Rules: environments, and tiers (primary, secondary,
# subsystem, unparsed); an empty list matches everything.
notify:
  desktop: {}
  # Phone pushes carry metadata only (no log message). The topic is the only
  # secret on the public server: keep it long and random, in ~/.config/pt/env.
  ntfy:
    topic_env: PT_NTFY_TOPIC
    # server: https://ntfy.sh
    when:
      tiers: [primary, subsystem]   # every environment; add environments: [...] to narrow
